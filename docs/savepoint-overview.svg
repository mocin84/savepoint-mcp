<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How SavePoint carries a project between Claude chats</title>
  <desc id="desc">Claude sends MCP requests to a Cloudflare Worker. The Worker stores files in R2 and project metadata in D1. A continue box lets another chat reopen the same project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102A3A"/><stop offset="1" stop-color="#1D242C"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E0242B"/><stop offset="1" stop-color="#E0242B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071923" flood-opacity=".26"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#F29A9E"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="35" r="155" fill="#fff" opacity=".035"/>
  <circle cx="15" cy="390" r="190" fill="#fff" opacity=".025"/>
  <text x="56" y="67" fill="#F29A9E" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">PROJECT CONTINUITY FOR CLAUDE</text>
  <text x="56" y="112" fill="#F7F7F8" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700">Save here. Continue in another chat.</text>
  <text x="56" y="145" fill="#C9CCD1" font-family="Segoe UI,Arial,sans-serif" font-size="16">A small remote MCP server for project files and handoffs.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="202" width="230" height="140" rx="19" fill="#FFFFFF"/>
    <rect x="78" y="224" width="44" height="44" rx="13" fill="#12171D"/>
    <path d="M89 244h22v17H89zM92 244v-4a7 7 0 0 1 14 0v4" fill="none" stroke="#F7F7F8" stroke-width="3" stroke-linecap="round"/>
    <path d="m94 252 4 4 8-9" fill="none" stroke="#E0242B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="296" fill="#12171D" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Claude chats</text>
    <text x="78" y="321" fill="#5B6470" font-family="Segoe UI,Arial,sans-serif" font-size="13">Start · save · continue</text>

    <rect x="438" y="202" width="300" height="140" rx="19" fill="#FFFFFF"/>
    <rect x="460" y="224" width="44" height="44" rx="13" fill="#FDECEC"/>
    <path d="M471 237h22M471 245h22M471 253h15" fill="none" stroke="#B81C22" stroke-width="3" stroke-linecap="round"/>
    <text x="460" y="296" fill="#12171D" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">SavePoint Worker</text>
    <text x="460" y="321" fill="#5B6470" font-family="Segoe UI,Arial,sans-serif" font-size="13">MCP tools · validation · ZIP links</text>

    <rect x="892" y="190" width="250" height="66" rx="17" fill="#FFFFFF"/>
    <rect x="910" y="205" width="35" height="35" rx="10" fill="#F1F2F4"/>
    <path d="M919 215h17v16h-17zM922 211h11" fill="none" stroke="#5B6470" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="960" y="220" fill="#12171D" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">D1</text>
    <text x="960" y="240" fill="#5B6470" font-family="Segoe UI,Arial,sans-serif" font-size="12">project and file metadata</text>

    <rect x="892" y="278" width="250" height="66" rx="17" fill="#FFFFFF"/>
    <rect x="910" y="293" width="35" height="35" rx="10" fill="#FFF0D8"/>
    <path d="M919 301h17v19h-17zM923 297h9" fill="none" stroke="#BD7B22" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="960" y="308" fill="#12171D" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">R2</text>
    <text x="960" y="328" fill="#5B6470" font-family="Segoe UI,Arial,sans-serif" font-size="12">text files and temporary ZIPs</text>
  </g>

  <path d="M298 272h128" fill="none" stroke="#F29A9E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="322" y="255" fill="#F7C9CB" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">HTTPS · MCP</text>
  <path d="M750 251h122" fill="none" stroke="#F29A9E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 292h98v-68h24M848 292v19h24" fill="none" stroke="#F29A9E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="56" y="366" width="1088" height="1" fill="#C9CCD1" opacity=".25"/>
  <text x="56" y="395" fill="#C9CCD1" font-family="Segoe UI,Arial,sans-serif" font-size="13">12-hour idle expiry</text>
  <circle cx="190" cy="390" r="3" fill="#E0242B"/>
  <text x="209" y="395" fill="#C9CCD1" font-family="Segoe UI,Arial,sans-serif" font-size="13">Hourly cleanup</text>
  <circle cx="334" cy="390" r="3" fill="#E0242B"/>
  <text x="353" y="395" fill="#C9CCD1" font-family="Segoe UI,Arial,sans-serif" font-size="13">Free-tier-compatible defaults</text>
</svg>
