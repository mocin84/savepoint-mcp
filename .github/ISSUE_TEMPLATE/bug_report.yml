name: Bug report
description: Report a reproducible problem with Savepoint.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include access keys, project codes, download links, or private project data. Report security issues privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Configure ...\n2. Call ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Savepoint version or commit
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, project codes, download tokens, and personal data.
    validations:
      required: false
