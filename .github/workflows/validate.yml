name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Initialize local D1
        run: npx wrangler d1 execute savepoint-db --local --file=schema.sql

      - name: Start local Worker
        shell: bash
        run: |
          npx wrangler dev --local --port 8787 --var MAX_FILES:12 --var RATE_LIMIT_PER_MIN:100000 > worker.log 2>&1 &
          echo $! > worker.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat worker.log
          exit 1

      - name: Run smoke checks
        run: npm run smoke
        env:
          SMOKE_MAXFILES: "12"

      - name: Stop local Worker
        if: always()
        shell: bash
        run: if [ -f worker.pid ]; then kill "$(cat worker.pid)" || true; fi
